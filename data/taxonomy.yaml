# Theme-centred taxonomy (v2): every section is about recursive self-improvement (RSI) or AI for AI (AI4AI).
- id: surveys
  title: Surveys and Position Papers
  children:
    - id: surveys.rsi
      title: Surveys on recursive self-improvement, self-evolving AI, and AI4AI
    - id: surveys.ai-scientist
      title: Surveys on AI scientists and automated AI research
    - id: surveys.position
      title: Position papers

- id: foundations
  title: Foundations of Recursive Self-Improvement
  blurb: The idea, its definitions, and what theory says about its limits.
  children:
    - id: foundations.classic
      title: Classical lineage (intelligence explosion, Gödel machines, learning to learn)
    - id: foundations.levels
      title: Definitions and levels
    - id: foundations.theory
      title: Theory and limits of recursive improvement

- id: rsi-weights
  title: RSI in Weights (Models That Improve Their Own Training Signal)
  blurb: The model generates the data, rewards, or curricula that train its next version.
  children:
    - id: rsi.self-training
      title: Iterated self-training and bootstrapped reasoning
    - id: rsi.self-reward
      title: Self-rewarding and self-judging models
    - id: rsi.self-play
      title: Self-play and proposer-solver co-evolution
    - id: rsi.self-adapt
      title: Self-adaptation and learned update procedures
    - id: rsi.limits
      title: Limits of recursive training (collapse, sharpening, self-bias)
    - id: rsi.frontier
      title: Models trained on their predecessors' outputs

- id: rsi-agents
  title: RSI in Agents (Systems That Rewrite Their Own Improver)
  blurb: The agent edits the code, prompts, or search procedure that produces its next version.
  children:
    - id: rsi.self-referential
      title: Self-referential optimizers
    - id: rsi.self-modifying
      title: Self-modifying agents (Gödel-machine lineage)
    - id: rsi.meta-evolution
      title: Evolving the improver (meta-level self-evolution)

- id: ai4ai
  title: AI for AI (Automating the AI Research Pipeline)
  blurb: AI systems that improve the artifacts from which the next AI systems are built.
  children:
    - id: ai4ai.agent-design
      title: Automated design of AI agents and workflows
    - id: ai4ai.mle
      title: ML engineering and experimentation agents
    - id: ai4ai.discovery
      title: LLM-guided discovery of ML algorithms and code
    - id: ai4ai.algorithms
      title: Objectives, optimizers, and learning algorithms
    - id: ai4ai.architecture
      title: Architectures
    - id: ai4ai.kernels
      title: Kernels, compilers, and systems for AI
    - id: ai4ai.data
      title: Training data, environments, and benchmarks generated by AI
    - id: ai4ai.alignment
      title: Automated alignment, interpretability, and evaluation research
    - id: ai4ai.ideation
      title: Research ideation for AI research
    - id: ai4ai.writing-review
      title: Writing, reviewing, and reproducing AI research
    - id: ai4ai.scientist
      title: End-to-end AI scientists for AI research

- id: closing
  title: Closing the Loop (RSI Through AI4AI)
  blurb: Where AI research agents improve themselves, and where models help build their successors.
  children:
    - id: closing.research-agents
      title: Research agents that improve themselves
    - id: closing.lab-evidence
      title: Evidence from frontier labs

- id: evaluation
  title: Measuring RSI and AI4AI
  children:
    - id: evaluation.benchmarks
      title: Benchmarks of AI research and development ability
    - id: evaluation.measurement
      title: Measuring self-improvement and AI R&D automation

- id: safety
  title: Safety, Governance, and Forecasting
  children:
    - id: safety.frameworks
      title: Frontier safety frameworks, system cards, and governance
    - id: safety.forecasting
      title: Forecasting and economics of AI R&D automation
    - id: safety.failures
      title: Failure modes of self-improving loops and oversight

- id: background
  title: Background (Non-Recursive Self-Improvement)
  blurb: A short, curated set of baselines that do not improve their own improver.
  children:
    - id: background.refine
      title: Inference-time self-refinement and self-correction
    - id: background.context
      title: Prompt, memory, and skill optimization with a fixed procedure
