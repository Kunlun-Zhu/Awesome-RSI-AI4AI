- key: zelikman2024self
  system: STOP
  source:
    arxiv: '2310.02304'
    version: v3
    pdf: figures/_refs/pdf/2310.02304.pdf
  level: E2
  outcome: positive (GPT-4); negative (GPT-3.5, Mixtral)
  justification: The level is set by the GPT-4 arm, where the improved improver beats its frozen seed and a full-budget
    fixed improver on held-out instances; the same procedure lowers held-out meta-utility with GPT-3.5 and Mixtral.
  level_in_current_text: E2 (GPT-4 arm)
  level_change: none
  loops:
  - name: self-improvement of the improver program, I_t = I_{t-1}(meta-utility, I_{t-1}, LM)
    sets_level: true
    artifact: improver program
    P: the current improver, applied to its own code (changes, procedural)
    V: meta-utility on training LPN instances (fixed)
    U: the improver returns its best candidate by meta-utility (part of the improver code)
    closure: '{P} proc.'
    level: E2 with GPT-4; E1 with GPT-3.5 and Mixtral
  - name: downstream task improvement (an improver applied to a task solution)
    sets_level: false
    artifact: task solution
    P: improver I_t (fixed during the task)
    V: task utility
    U: improver's choice
    closure: empty
    level: E0
  changed_component:
    members:
    - P
    kind: procedural
  evidence_of_reuse_or_fixity:
    type: reuse
    location: Fig. 3 caption, p. 3
    quote: STOP (Algorithm 1) uses a seed improver program to iteratively optimize its own code using LM calls and
      a meta-utility function evaluating how well an improver optimizes code for downstream tasks.
  strongest_comparison:
    compared: see the GPT-4 arm
    evaluation: 50 held-out LPN instances
    evaluation_steered_selection: 'no'
    cost_matched: caps matched; greedy full-budget control also beaten
    starting_artifacts_matched: 'yes'
    replication: 5 runs, +/- 1 SE
    numbers: 61.0 -> 72.3 (T=3) / 72.2 (T=4), digitized
    location: Sec. 5.1, p. 6
    quote: To evaluate the generalization of improved improvers to new problem instances of the same task, we report
      test meta-utility on an independent set of Mtest = 50 LPN instances not seen during improvement.
  arms:
  - arm: GPT-4 (gpt-4-0314)
    compared: improved improver I_T vs the frozen seed improver I_0, both applied to the same initial LPN solution
      under the same LM-call and utility-call caps; also a fixed greedy iterative improver that spends the full
      budget
    evaluation: test meta-utility on 50 held-out LPN instances not seen during improvement
    evaluation_steered_selection: no; T fixed in advance ('a prespecified number of iterations T', p. 5)
    cost_matched: caps matched (LanguageModel(budget=n, max_responses_per_call=m), utility budget n*m+1; Fig. A.20,
