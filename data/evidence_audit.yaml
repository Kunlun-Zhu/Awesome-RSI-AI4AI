- key: yang2026frontis
  system: Frontis-MA1
  source:
    arxiv: '2607.28568'
    version: v1
    pdf: figures/_refs/pdf/2607.28568.pdf
  level: E1
  outcome: positive
  justification: On-policy RL reuses the updated weights to generate later rollouts (E1), but the positive base-versus-trained
    comparison mixes teacher distillation with RL and never compares the RL loop against its frozen SFT predecessor,
    so the loop is not shown to produce a better improver.
  level_in_current_text: not established (uncounted)
  level_change: unclassified -> E1
  loops:
  - name: test-time search on one task (OpenMLE-Evo)
    sets_level: false
    artifact: ML program
    P: trained model applying Draft/Improve/Debug/Crossover (frozen during search)
    V: sandbox task evaluator (fixed)
    U: three-factor parent selection; task-local experience board read by the harness (fixed)
    closure: empty
    level: E0
  - name: scaffold/framework development (AIRA-Evo -> OpenMLE-Evo)
    sets_level: false
    artifact: search harness
    P: human designers
    V: benchmark comparisons
    U: human decision
    closure: not an AI-driven loop; the harness is fixed in every reported run
    level: E0 (not an automated loop)
  - name: 'model training (OpenMLE-ERL): SFT warm start, then online RL'
    sets_level: true
    artifact: model weights
    P: SFT data distilled from stronger teacher models (not recursive); RL rollouts sampled from the current policy
      (changes, parametric)
    V: sandbox score mapped through adaptive bounds derived from the policy's on-policy score frontier (changes
      with the policy, parametric)
    U: SFT then RL with entropic advantages (fixed)
    closure: '{P} par. (arguably {P,V} par.)'
    level: E1
  - name: meta-evolution across model generations (search trajectories train the next generation)
    sets_level: false
    artifact: successor model
    P: --
    V: --
    U: --
    closure: only generation 1 is reported; a successor trained on Frontis-MA1's own search trajectories is not
      reported
    level: not reported
  changed_component:
    members:
    - P
    - V (reward bounds)
    kind: parametric
  evidence_of_reuse_or_fixity:
    type: reuse (training loop) and fixity (framework)
    location: Sec. 4.3, p. 13
    quote: OpenMLE therefore derives tighter adaptive bounds from each task’s historical on-policy score frontier
    extra:
    - location: Sec. 8, p. 31
      quote: In OpenMLE, evolution operates primarily over candidate solutions, while the evolutionary system itself
        remains largely fixed.
    - location: Sec. 4, p. 10
      quote: Execution-grounded SFT distills complete solutions and successful local revisions from stronger teachers
  strongest_comparison:
    compared: post-trained Frontis-MA1-35B vs its frozen base Qwen3.6-35B-A3B as the proposer in the identical OpenMLE-Evo
      harness; the RL loop's own frozen predecessor (the SFT warm-start checkpoint) is not compared
    evaluation: MLE-Bench Lite final test (22 tasks) after validation-based node selection; held-out NatureBench
      Lite (10 tasks, hidden evaluator)
    evaluation_steered_selection: no for node selection; whether MLE-Bench Lite results informed training or checkpoint
      choices is not reported (training data deduplicated against evaluation benchmarks)
    cost_matched: sandbox time matched (12 h per task on one RTX 4090; 4 h on NatureBench); inference cost not compared
    starting_artifacts_matched: yes (same tasks and harness)
    replication: 3 runs on MLE-Bench Lite (mean +/- SD); no replicates reported on NatureBench
    numbers: Medal Average 39.39% +/- 5.67 -> 60.61% +/- 7.73; Human Rank 0.5828 -> 0.7647; NatureBench Lite Match-SOTA
      5/10 -> 7/10, Surpass-SOTA 2/10 -> 3/10; companion 30B model 34.85% -> 53.03%
    location: Sec. 1, p. 5; Table 1, p. 18; Table 2, p. 28; Table 9, p. 60
    quote: At the model level, under the identical OpenMLE-Evo harness, Frontis-MA1-35B improves over Qwen3.6-35B-A3B
      from 39.39% to 60.61% Medal Average and from 0.5828 to 0.7647 Human Rank.
  other_comparisons:
  - what: 'framework swap with the base model fixed: AIRA-Evo -> OpenMLE-Evo NatureBench adapter, Match-SOTA 2/10
      -> 5/10'
    note: compares two human-designed harnesses
  - what: 'reward-shaping ablation during RL (simpler early-stage harness): test medal rate 34.8 +/- 4.3 vs 24.2
      +/- 5.7'
    note: compares RL variants, not the RL loop against its frozen predecessor
  survey_text_checks:
  - where: tables/v7_ledger.tex (level), fig:evidence caption, sections/v7_1b_landscape.tex, sections/v7_6_successor.tex
    ours: not est.; Frontis-MA1, whose return as improver is unreported, is left uncounted; the trained model's
      later return as the improver remains unreported
    source: The trained model is deployed as the proposer ('variation engine') of later OpenMLE-Evo searches, and
      its RL stage is on-policy (p. 13), which the coding manual's fourth tie-breaker codes {P} par.; what is unreported
      is a second generation trained on Frontis-MA1's own search trajectories ('generation 1', p. 5).
    verdict: should be counted at E1 (training loop); the framework loop is E0
  - where: sections/v7_6_successor.tex
    ours: the trained model in a fixed framework raises the rate of matching the state of the art from 50% to 70%,
      and the improved framework with a fixed model from 20% to 50%
    source: Supported (Table 2, p. 28); ten tasks, so each task moves the rate by ten points.
    verdict: supported
