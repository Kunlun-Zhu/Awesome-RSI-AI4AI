# Evidence audit for decisive classifications (supplement S8 of From-RSI-to-AI4AI).
# One record per system; keys match papers.yaml. Quotes are verbatim (under 50 words) with section and page.
# 'not reported' means the source does not state it. Generated 2026-10-02.
audit:
  title: Evidence audit for decisive classifications
  date: '2026-10-02'
  scope: the 12 systems of paper/tables/v7_ledger.tex plus SICA, SEAL, NAS with an RL controller, and population-based
    training
  sources: arXiv PDFs (version given per record) in From-RSI-to-AI4AI/figures/_refs/pdf/, read with pdftotext; every
    quote was checked against the text of the stated page
  levels:
    E0: 'iteration: artifact-level optimization under a documented fixed improver'
    E1: 'recursive reuse: a changed proposer, verifier, or update rule (parametric or procedural) is used in subsequent
      improvement; no benefit implied'
    E2: 'better improver: the changed mechanism produced greater audited improvement, at matched cost and from matched
      starting artifacts, than an appropriate frozen control, scored by an evaluation that did not steer selection'
    E3: 'acceleration: audited improvement rates rose across successive replacements of the improver'
  outcomes:
    positive: the changed mechanism beat the control on the comparison as reported
    negative: the changed mechanism did worse than the control
    inconclusive: no difference distinguishable from noise, or the authors report the test as inconclusive
    diagnostic only: a measurement bearing on the improver (e.g. a correlation or judge accuracy) without an improvement
      comparison against a control
    none: no comparison bearing on the improver is reported (task-score comparisons only, or the improver is fixed)
  rules:
  - The level is the highest whose conditions the source reports; an unreported condition counts as unmet.
  - E2 additionally requires that the source report uncertainty (replicate runs, intervals, or a test) and that
    the difference exceed it.
  - 'The coding manual''s tie-breakers apply: a separate agent that stays fixed and edits another agent leaves the
    loop empty (tie-breaker 3); on-policy training of the model that generates its own training samples gives at
    least {P} par. (tie-breaker 4).'
  - Where a paper has several loops, each is coded and the loop that sets the level is named.
  - Numbers read from figures are marked as digitized.
  summary:
    E3: []
    E2:
    - zelikman2024self (GPT-4 arm)
    - zhang2026hyperagents
    E1:
    - zelikman2022star
    - yuan2024self
    - grattafiori2024llama
    - yang2026frontis
    - zhang2025darwin
    - iacob2026red
    - wang2025huxley
    - novikov2025alphaevolve
    - srikanth2026recursive
    - robeyns2025self
    - zweiger2025self
    - zoph2017neural
    - jaderberg2017population
    E0:
    - hu2025automated
records:
- key: zelikman2022star
  system: STaR
  source:
    arxiv: '2203.14465'
    version: v2
    pdf: figures/_refs/pdf/2203.14465.pdf
  level: E1
  outcome: none
  justification: Each round's fine-tuned model generates the next round's rationales, and no comparison tests whether
    a later model is a better data generator than a frozen earlier one.
  level_in_current_text: E1
  level_change: none
  loops:
  - name: rationale bootstrapping (outer loop of Alg. 1)
    sets_level: true
    artifact: model weights
    P: the fine-tuned model samples rationales (changes, parametric)
    V: 'filter: final answer matches the gold answer (fixed)'
    U: fine-tune the original base model on kept rationales (fixed)
    closure: '{P} par.'
    level: E1
  changed_component:
    members:
    - P
    kind: parametric
  evidence_of_reuse_or_fixity:
    type: reuse
    location: Sec. 3.1, p. 3
    quote: We fine-tune the base model M on this filtered dataset, and then restart this process by generating the
      new rationales with the newly fine-tuned model.
  strongest_comparison:
    compared: final STaR model vs GPT-J fine-tuned directly on answers (task accuracy); no comparison of a later
      round's model as data generator against a frozen earlier one
    evaluation: CommonsenseQA dev set (test withheld); GSM8K test
    evaluation_steered_selection: 'partly: the reported CQA figure is the best over iterations after running to
      saturation'
    cost_matched: no (methods use different amounts of training data)
    starting_artifacts_matched: same base model (GPT-J)
    replication: no replicates or uncertainty reported
    numbers: CQA dev 72.5 (with rationalization) and 68.8 (without) vs 60.0; GSM8K test 10.7 / 10.1 vs 5.8
    location: Sec. 4.1, p. 5; Tables 1-2, pp. 7-8
    quote: We run STaR until we see performance saturate, and we report the best results.
  other_comparisons: []
  survey_text_checks:
  - where: tables/v7_ledger.tex (strongest comparison)
    ours: Later rounds' models on a test split of the same tasks
    source: CQA results are on the dev set (the test set is withheld) and are the best over iterations ('we report
      the best results', p. 5); GSM8K results are on the test set.
    verdict: partly supported
- key: yuan2024self
  system: Self-Rewarding LMs
  source:
    arxiv: '2401.10020'
    version: v3
    pdf: figures/_refs/pdf/2401.10020.pdf
  level: E1
  outcome: diagnostic only
  justification: Each model generates and judges the next round's preference data, but the report measures judge
    accuracy and task scores without comparing the improvement produced with the updated judge against a frozen
    one.
  level_in_current_text: E1
  level_change: none
  loops:
  - name: iterative DPO, M1 -> M2 -> M3
    sets_level: true
    artifact: model weights
    P: the model writes candidate responses (changes, parametric)
    V: the same model scores them through a fixed LLM-as-a-judge prompt (changes, parametric)
    U: DPO on self-labelled pairs (fixed)
    closure: '{P,V} par.'
    level: E1
  changed_component:
    members:
    - P
    - V
    kind: parametric
  evidence_of_reuse_or_fixity:
    type: reuse
    location: Sec. 2.4, p. 4
    quote: 'M2: Initialized with M1, then trained with AIFT(M1) data using DPO. M3: Initialized with M2, then trained
      with AIFT(M2) data using DPO.'
  strongest_comparison:
    compared: the judge's agreement with held-out human rankings across iterations (SFT baseline, M1, M2, M3); no
      comparison of the improvement produced with the updated judge against a frozen judge
    evaluation: evaluation split of the Open Assistant human rankings (541 examples; the 1,630-example training
      split supplies the EFT seed data)
    evaluation_steered_selection: no selection on it reported (fixed number of iterations)
    cost_matched: not applicable (no improvement comparison)
    starting_artifacts_matched: not applicable
    replication: no replicates or uncertainty reported
    numbers: 'pairwise accuracy: SFT baseline (IFT only) 65.1%, M1 (IFT+EFT seed, before any self-rewarding) 78.7%,
      M2 80.4%, M3 81.7%'
    location: Sec. 3.2.2 and Table 4, p. 10
    quote: We find improvements across all five metrics measured when using IFT+EFT vs. IFT alone, e.g., the pairwise
      accuracy agreement with humans increases from 65.1% to 78.7%.
  other_comparisons:
  - what: 'instruction following, head to head (GPT-4 judge): M2 vs M1 55.5% vs 11.7% wins; M3 vs M2 47.7% vs 12.5%;
      AlpacaEval 2.0 win rate 9.94 -> 15.38 -> 20.44'
    note: task scores of later models
  survey_text_checks:
  - where: sections/v7_2_feedback.tex and tables/v7_ledger.tex
    ours: its agreement with human preference rankings rises from 65.1% to 81.7%
    source: 65.1% is the SFT baseline trained without the EFT seed data; M1 (seed IFT+EFT, before self-rewarding)
      is already 78.7%, so the self-rewarding iterations account for 78.7% -> 81.7% (Table 4, p. 10).
    verdict: 'misattributed: most of the rise comes from human-derived seed data'
  - where: tables/v7_ledger.tex (next comparison)
    ours: Judge accuracy against a standard it does not train on
    source: Table 4 measures judge accuracy on a held-out split of the Open Assistant human rankings, the same standard
      whose training split supplies the EFT data.
    verdict: partly provided (held-out split of the same standard)
