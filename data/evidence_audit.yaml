    starting_artifacts_matched: yes (same initial solution and task)
    replication: 5 independent STOP runs, mean +/- 1 SE; bands of T=0 and T>=1 do not overlap; no formal test
    numbers: 61.0 (seed) -> 68.4 (T=1) -> 70.1 (T=2) -> 72.3 (T=3) -> 72.2 (T=4), digitized from Fig. 4; text gives
      the GPT-4 seed as 61%
    location: Sec. 5.1, p. 6; Fig. 4, p. 5
    quote: To evaluate the generalization of improved improvers to new problem instances of the same task, we report
      test meta-utility on an independent set of Mtest = 50 LPN instances not seen during improvement.
